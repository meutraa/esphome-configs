packages:
  athom.rgbct-light: github://athom-tech/athom-configs/athom-rgbct-light.yaml

esphome:
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

api:
  encryption:
    key: ${api_key}

network:
  enable_ipv6: true

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  power_save_mode: none
